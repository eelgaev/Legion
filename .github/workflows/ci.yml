name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    # Self-hosted aarch64 box with the CUDA 13.0 toolkit and no GPU. Pull requests from forks
    # do not run here: a public repo must not run untrusted code on a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, cuda]
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: /home/runner/cargo-target
    steps:
      - uses: actions/checkout@v4
      - name: ggml submodule
        run: git submodule update --init --depth 1 third_party/ggml
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The CPU reference kernels the engine tests run are Rust, so the tests build at opt-level
      # 1 (debug assertions stay on). One test at a time: the engine tests run 2-4 ggml threads
      # each, which spin at every node's barrier, and more threads than the runner's 4 cores
      # slowed one test from about 2 minutes to over an hour. Debug frames are deep: clap's
      # error path for the serve command line overflowed the default 2 MiB stack.
      - run: cargo test -- --test-threads=1
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: "1"
          RUST_MIN_STACK: "16777216"
      # CUDA 13.0 as on the GB10 boxes; the runner has the toolkit but no GPU, so this
      # compiles and links the CUDA build (kernels for sm_121a) without running it. No debug
      # info: with it cc builds the kernels with -G (device debug), and nvlink then refuses
      # kernels whose callees need more registers than their launch bounds allow.
      - name: clippy and build with --features cuda
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CUDA_PATH: /usr/local/cuda-13.0
          CMAKE_CUDA_ARCHITECTURES: 121a
          LIBRARY_PATH: /usr/local/cuda-13.0/lib64/stubs
          CARGO_TARGET_DIR: /home/runner/cargo-target-cuda
        run: |
          export PATH=/usr/local/cuda-13.0/bin:$PATH
          # The runner's glibc (2.41+) declares C23's rsqrt/rsqrtf noexcept and CUDA 13.0's
          # crt/math_functions.h declares them without, so nvcc stops at the mismatch (even in
          # CMake's compiler check). A bits/mathcalls.h ahead of glibc's declares glibc's two
          # under other names; device code keeps CUDA's. Not needed where glibc is older (the
          # GB10 boxes) or CUDA's header has the fix.
          shim=$(mktemp -d)
          trap 'rm -rf "$shim"' EXIT
          mkdir "$shim/bits"
          {
            echo '#define rsqrt __glibc_c23_rsqrt'
            echo '#define rsqrtf __glibc_c23_rsqrtf'
            for s in "" f l f16 f32 f64 f128 f32x f64x f128x; do
              echo "#define __DECL_SIMD___glibc_c23_rsqrt$s"
            done
            echo '#include_next <bits/mathcalls.h>'
            echo '#undef rsqrt'
            echo '#undef rsqrtf'
          } > "$shim/bits/mathcalls.h"
          export NVCC_PREPEND_FLAGS="-isystem $shim"
          cargo clippy --all-targets --features cuda -- -D warnings
          cargo build --features cuda
