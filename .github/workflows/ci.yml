name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# A newer push to a pull request cancels its older run; pushes to main queue instead, so every
# main commit gets its build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  build:
    # Self-hosted aarch64 box with the CUDA 13.0 toolkit and no GPU. Pull requests from forks
    # do not run here: a public repo must not run untrusted code on a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, cuda]
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: /home/runner/cargo-target
    steps:
      - uses: actions/checkout@v5
      - name: ggml submodule
        run: git submodule update --init --depth 1 third_party/ggml
      # A smoke test of the CPU release build: serve a tiny random-weight Gemma 4 31B checkpoint
      # (the real model's layout at toy sizes, 66 MB, pinned revision, cached on the runner) and
      # ask for 16 tokens. The weights are random, so only loading, the chat template and
      # generation are checked, not the text.
      - name: CPU release build
        run: cargo build --release
      - name: smoke test (tiny Gemma 4 31B on the CPU)
        env:
          REPO: optimum-intel-internal-testing/tiny-random-gemma4-31B
          REV: 737d788c3f87c65f5a2e1ef8f7d795041d99d142
        run: |
          model=$HOME/ci-models/tiny-random-gemma4-31B-$REV
          if [ ! -f "$model/.complete" ]; then
            mkdir -p "$model"
            for f in config.json generation_config.json chat_template.jinja tokenizer.json \
                     tokenizer_config.json processor_config.json model.safetensors; do
              curl -sfL --retry 3 -o "$model/$f" "https://huggingface.co/$REPO/resolve/$REV/$f"
            done
            touch "$model/.complete"
          fi
          port=18080
          "$CARGO_TARGET_DIR/release/legion" serve --model "$model" --device cpu --threads 4 \
            --ctx-size 1024 --max-seqs 1 --port $port > serve.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null; wait $pid 2>/dev/null' EXIT
          for i in $(seq 120); do
            curl -sf -m 2 http://127.0.0.1:$port/health > /dev/null && break
            kill -0 $pid 2>/dev/null || { cat serve.log; exit 1; }
            sleep 0.5
          done
          id=$(curl -sf http://127.0.0.1:$port/v1/models | python3 -c 'import json, sys; print(json.load(sys.stdin)["data"][0]["id"])')
          curl -sf -m 60 http://127.0.0.1:$port/v1/chat/completions -H 'content-type: application/json' \
            -d "{\"model\": \"$id\", \"messages\": [{\"role\": \"user\", \"content\": \"Hello there\"}], \"max_tokens\": 16, \"temperature\": 0}" \
            > reply.json || { cat serve.log; exit 1; }
          python3 -c 'import json, sys; d = json.load(open("reply.json")); n = d["usage"]["completion_tokens"]; print("generated", n, "tokens"); sys.exit(n < 1)'
      # The release CUDA 13.0 build, as on the GB10 boxes. The runner has the toolkit but no
      # GPU, so this compiles and links the CUDA build (kernels for sm_121a) without running it.
      - name: release build with --features cuda
        env:
          CUDA_PATH: /usr/local/cuda-13.0
          CMAKE_CUDA_ARCHITECTURES: 121a
          LIBRARY_PATH: /usr/local/cuda-13.0/lib64/stubs
          CARGO_TARGET_DIR: /home/runner/cargo-target-cuda
        run: |
          export PATH=/usr/local/cuda-13.0/bin:$PATH
          # The runner's glibc (2.41+) declares C23's rsqrt/rsqrtf noexcept and CUDA 13.0's
          # crt/math_functions.h declares them without, so nvcc stops at the mismatch (even in
          # CMake's compiler check). A bits/mathcalls.h ahead of glibc's declares glibc's two
          # under other names; device code keeps CUDA's. Not needed where glibc is older (the
          # GB10 boxes) or CUDA's header has the fix.
          shim=$(mktemp -d)
          trap 'rm -rf "$shim"' EXIT
          mkdir "$shim/bits"
          {
            echo '#define rsqrt __glibc_c23_rsqrt'
            echo '#define rsqrtf __glibc_c23_rsqrtf'
            for s in "" f l f16 f32 f64 f128 f32x f64x f128x; do
              echo "#define __DECL_SIMD___glibc_c23_rsqrt$s"
            done
            echo '#include_next <bits/mathcalls.h>'
            echo '#undef rsqrt'
            echo '#undef rsqrtf'
          } > "$shim/bits/mathcalls.h"
          export NVCC_PREPEND_FLAGS="-isystem $shim"
          cargo build --release --features cuda
  x86-cuda12-sm70:
    # An x86 box with V100s (sm_70) on PCIe: CUDA 13 dropped sm_70, so such a build needs CUDA
    # 12.x. GitHub's hosted x86_64 runner in the CUDA 12.4.1 devel image (no GPU): compiles and
    # links the CUDA build for sm_70 only, never runs it.
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    timeout-minutes: 120
    env:
      CUDA_PATH: /usr/local/cuda
      CMAKE_CUDA_ARCHITECTURES: "70"
      LIBRARY_PATH: /usr/local/cuda/lib64/stubs
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl cmake \
            build-essential pkg-config clang libclang-dev
      - uses: actions/checkout@v5
      - name: ggml submodule
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 third_party/ggml
      - name: rust toolchain
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: release build with --features cuda (sm_70)
        run: |
          export PATH=/usr/local/cuda/bin:$PATH
          cargo build --release --features cuda
