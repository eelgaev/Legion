[package]
name = "legion"
version = "0.1.0"
edition = "2024"
description = "Inference engine for NVIDIA gaming PCs, DGX Spark (clusters) and the AC922"
license = "Apache-2.0"
publish = false
build = "build.rs"

[features]
default = []
# Build ggml with the CUDA backend (needs nvcc; set CMAKE_CUDA_ARCHITECTURES to pick targets).
cuda = []

[dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["webp"] }
libc = "0.2"
nix = { version = "0.29", default-features = false, features = ["sched", "signal", "fs", "mman"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = "0.1"
tower-http = { version = "0.6", features = ["cors", "limit", "request-id", "trace", "util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4"] }
fancy-regex = "0.14"
minijinja = { version = "3", features = ["json", "loop_controls", "preserve_order", "adjacent_loop_items", "serde"] }
minijinja-contrib = { version = "3", features = ["pycompat", "datetime"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
memmap2 = "0.9.11"
nvml-wrapper = "0.13"
nvml-wrapper-sys = "0.10"
rust-embed = "8"
prometheus-client = "0.25"
clap_complete = "4"
unicode-normalization = "0.1"

[build-dependencies]
bindgen = "0.72"
cc = { version = "1", features = ["parallel"] }
cmake = "0.1"

[dev-dependencies]
http-body-util = "0.1"
proptest = "1"
rcgen = "0.14"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
